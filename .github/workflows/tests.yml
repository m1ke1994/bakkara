name: Baccarat bot tests

on:
  push:
    branches:
      - fix/sequential-baccarat-observer
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Compile backend Python
        run: python -m compileall -q backend/app
      - name: Smoke test running FastAPI API
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/bakkara-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8010/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from urllib.request import urlopen
          def get(path):
              with urlopen("http://127.0.0.1:8010" + path, timeout=5) as response:
                  assert response.status == 200, (path, response.status)
                  return json.load(response)
          health = get("/api/health")
          assert health == {"ok": True}, health
          state = get("/api/state")
          assert "observation" in state and "browser" in state, state.keys()
          print("FastAPI smoke passed: /api/health + /api/state")
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
